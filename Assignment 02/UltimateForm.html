<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form - Student Internship</title>
</head>
<body>

    <main>
        <h1>Application Form</h1>
        <p>Student internship application • * Required</p>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Personal Details Fieldset -->
            <fieldset>
                <legend>Personal Details</legend>
                
                <p>
                    <label for="fullname">Full name *</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Yuvraj Singh" required>
                </p>

                <p>
                    <label for="email">Email *</label><br>
                    <input type="email" id="email" name="email" placeholder="yuvraj@example.com" required>
                </p>

                <p>
                    <label for="password">Password *</label><br>
                    <input type="password" id="password" name="password" placeholder="••••••••••••" required>
                </p>

                <p>
                    <label for="phone">Phone *</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
                </p>

                <p>
                    <label for="portfolio">Portfolio URL</label><br>
                    <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">
                </p>

                <p>
                    <label for="age">Age *</label><br>
                    <input type="number" id="age" name="age" placeholder="18" min="16" max="100" required>
                </p>

                <p>
                    Gender: 
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="other" checked>
                    <label for="other">Other / prefer not to say</label>
                </p>
            </fieldset>

            <br>

            <!-- Education Fieldset -->
            <fieldset>
                <legend>Education</legend>

                <p>
                    <label for="course">Course *</label><br>
                    <select id="course" name="course" required>
                        <option value="btech_cs">BTech - Computer Science</option>
                        <option value="btech_it">BTech - Information Technology</option>
                        <option value="bca">BCA</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="city">Preferred city (datalist)</label><br>
                    <input type="text" id="city" name="city" list="city-options" placeholder="Delhi">
                    <datalist id="city-options">
                        <option value="Delhi"></option>
                        <option value="Mumbai"></option>
                        <option value="Bengaluru"></option>
                        <option value="Hyderabad"></option>
                        <option value="Pune"></option>
                    </datalist>
                </p>

                <p>
                    Skills: 
                    <input type="checkbox" id="html" name="skills" value="HTML">
                    <label for="html">HTML</label>
                    
                    <input type="checkbox" id="css" name="skills" value="CSS">
                    <label for="css">CSS</label>
                    
                    <input type="checkbox" id="javascript" name="skills" value="JavaScript">
                    <label for="javascript">JavaScript</label>
                </p>
            </fieldset>

            <br>

            <!-- Upload & Extras Fieldset -->
            <fieldset>
                <legend>Upload &amp; Extras</legend>

                <p>
                    <label for="available_date">Available from</label><br>
                    <input type="date" id="available_date" name="available_date" value="2026-11-15">
                </p>

                <p>
                    <label for="interview_time">Interview time</label><br>
                    <input type="time" id="interview_time" name="interview_time" value="10:30">
                </p>

                <p>
                    <label for="resume">Resume *</label><br>
                    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
                </p>

                <p>
                    <label for="stipend">Expected monthly stipend: ₹<span id="stipend-val">10,000</span></label><br>
                    <input type="range" id="stipend" name="stipend" min="0" max="50000" step="1000" value="10000" oninput="document.getElementById('stipend-val').textContent = Number(this.value).toLocaleString('en-IN')">
                </p>

                <p>
                    <label for="fav_color">Favourite colour:</label>
                    <input type="color" id="fav_color" name="fav_color" value="#008080">
                </p>

                <p>
                    <label for="reason">Why would you like to join?</label><br>
                    <textarea id="reason" name="reason" rows="4" cols="50" placeholder="I want to practise HTML and CSS on real projects."></textarea>
                </p>
            </fieldset>

            <br>

            <!-- Buttons -->
            <div>
                <button type="submit">Submit application</button>
                <button type="reset">Reset</button>
            </div>

        </form>
    </main>

</body>
</html>
